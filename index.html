<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Freedom Unit Converter</title>
    <meta name="description" content="Freedom Unit Converter - Inches, feet, yards, miles, oz, lb, fl oz, cups, gallons, °F etc." />
    <link rel="stylesheet" href="./assets/css/styles.css">
    <link rel="stylesheet" href="./assets/css/converter.css">
  </head>
<header class="site-header container">
    <div>
        <button id="theme-toggle" class="theme-toggle" aria-pressed="false" aria-label="Toggle Dark Mode">
            <span class="icon" id="theme-icon">☀️</span>
            <span id="theme-text">Light</span>
        </button>
    </div>
</header>
  <body>
    <main class="container">
      <section class="converter card no-hover">
        <h2>Freedom Unit Converter</h2>
        <p class="muted">Wähle Kategorie, Einheit und gib einen Wert ein - Ergebnis wird sofort berechnet.</p>
        <div class="converter-row">
          <label for="category">Kategorie</label>
          <select id="category">
            <option value="length">Länge</option>
            <option value="mass">Masse</option>
            <option value="volume">Volumen</option>
            <option value="temperature">Temperatur</option>
          </select>
        </div>

        <div class="converter-row">
          <label for="value">Wert</label>
          <input id="value" type="number" step="any" value="1" />
        </div>

        <div class="converter-row">
          <label for="from">Von</label>
          <select id="from"></select>
        </div>

        <div class="converter-row">
          <label for="to">Nach</label>
          <select id="to"></select>
        </div>

        <div class="converter-row result-row">
          <div id="result">-</div>
          <div>
            <button class="input-copy-button" onclick="copyResultToInput()">In Input kopieren</button>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer container">
      <div>© 2025 - Freedom Converter</div>
    </footer>

    <!-- Welcome modal -->
    <div id="welcome-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="welcome-title" aria-hidden="true">
      <div class="modal-content">
        <h3 id="welcome-title">Disclaimer</h3>
        <p>Diese Einheiten sind frei erfunden, ungefähr richtig und völlig unnötig genau.</p>
        <div class="modal-actions">
          <button id="modal-ok" class="btn">OK</button>
        </div>
      </div>
    </div>

    <script src="./assets/js/script.js" defer></script>
    <script src="./assets/js/converter.js" defer></script>
  </body>
</html>
